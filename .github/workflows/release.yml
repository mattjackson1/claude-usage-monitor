name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx vsce package --no-dependencies ${{ contains(github.ref_name, '-') && '--pre-release' || '' }}
      - name: Extract release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish to VS Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --no-dependencies --packagePath *.vsix ${{ contains(github.ref_name, '-') && '--pre-release' || '' }}
        env: { VSCE_PAT: '${{ secrets.VSCE_PAT }}' }
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
        env: { OVSX_PAT: '${{ secrets.OVSX_PAT }}' }
